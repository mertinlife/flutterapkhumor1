name: odyssey
description: A simple mood tracker application.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  collection: ^1.17.0
  dynamic_color: ^1.6.3
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.3.5
  flutter_svg: ^2.0.5
  freezed_annotation: ^2.2.0
  go_router: ^7.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2  # Required by flutter_localizations
  timeline_tile: ^2.0.0
  flutter_task_time_tracker: ^1.0.1
  syncfusion_flutter_calendar: ^31.2.15
  table_calendar: ^3.2.0  # For the calendar page
  persistent_bottom_nav_bar: ^6.2.1  # For stylish bottom navigation
  calendar_timeline: ^1.1.3  # For timeline calendar view



dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  build_runner: ^2.3.3 
  hive_generator: ^2.0.0
  flutter_lints: ^2.0.0
  json_serializable: ^6.6.1
  flutter_gen_runner: ^5.3.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/mood_icons/

dependency_overrides:
  intl: 0.20.2  # Override to use the same intl version required by flutter_localizations
